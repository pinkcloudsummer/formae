services:
  formae:
    image: ghcr.io/pinkcloudsummer/formae:latest
    container_name: formae
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - FORMAE_DB_PATH=/data/formae.db
      # Loaded automatically from .env in the same folder (not committed to git)
      - FORMAE_API_TOKEN=${FORMAE_API_TOKEN:?Set FORMAE_API_TOKEN in .env}
      - FORMAE_CORS_ORIGINS=${FORMAE_CORS_ORIGINS:-*}
    volumes:
      - ./data:/data
